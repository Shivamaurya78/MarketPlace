
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Listings | Marketplace</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
            rel="stylesheet">

    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Inter", sans-serif;
            background: #f6f7fb;
            color: #1f2937;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* NAVBAR */
        .navbar {
            height: 72px;
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6%;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: #111827;
        }

        .logo span {
            color: #2563eb;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .nav-link {
            font-size: 14px;
            font-weight: 600;
            color: #4b5563;
        }

        .nav-link:hover {
            color: #2563eb;
        }

        .sell-btn {
            background: #2563eb;
            color: white;
            padding: 11px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .sell-btn:hover {
            background: #1d4ed8;
        }

        /* PAGE */
        .container {
            width: 88%;
            max-width: 1200px;
            margin: 45px auto;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .page-title h1 {
            font-size: 32px;
            font-weight: 800;
            color: #111827;
            margin-bottom: 8px;
        }

        .page-title p {
            color: #6b7280;
            font-size: 14px;
        }

        .count-badge {
            background: #e8f0ff;
            color: #2563eb;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
        }

        /* LISTINGS GRID */
        .listings-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .listing-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 22px;
            transition: all 0.25s ease;
        }

        .listing-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
        }

        .listing-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .type-badge {
            background: #f3f4f6;
            color: #374151;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
        }

        .category {
            font-size: 12px;
            color: #6b7280;
        }

        .listing-name {
            font-size: 19px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 10px;
        }

        .detail {
            color: #6b7280;
            font-size: 13px;
            line-height: 1.6;
            min-height: 42px;
            margin-bottom: 18px;
        }

        .price {
            font-size: 21px;
            font-weight: 800;
            color: #111827;
            margin-bottom: 15px;
        }

        .location {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .location i {
            color: #2563eb;
        }

        .actions {
            display: flex;
            gap: 9px;
            border-top: 1px solid #f0f0f0;
            padding-top: 16px;
        }

        .action-btn {
            flex: 1;
            border: none;
            border-radius: 7px;
            padding: 10px 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .view-btn {
            background: #eff6ff;
            color: #2563eb;
        }

        .edit-btn {
            background: #f3f4f6;
            color: #374151;
        }

        .delete-btn {
            background: #fef2f2;
            color: #dc2626;
        }

        .action-btn:hover {
            opacity: 0.82;
        }

        /* EMPTY STATE */
        .empty-state {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 70px 20px;
            text-align: center;
        }

        .empty-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #eff6ff;
            color: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .empty-state h2 {
            font-size: 22px;
            margin-bottom: 8px;
            color: #111827;
        }

        .empty-state p {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 22px;
        }

        .empty-btn {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        /* LOADING */
        .loading {
            text-align: center;
            padding: 80px 20px;
            color: #6b7280;
        }

        .loading i {
            font-size: 28px;
            margin-bottom: 12px;
        }

        /* ERROR */
        .error-state {
            background: #fff;
            border: 1px solid #fecaca;
            color: #b91c1c;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            .listings-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 0 20px;
            }

            .nav-link {
                display: none;
            }

            .container {
                width: 92%;
                margin: 30px auto;
            }

            .page-header {
                align-items: flex-start;
                gap: 15px;
            }

            .page-title h1 {
                font-size: 26px;
            }

            .listings-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">

    <a href="/" class="logo">
        Market<span>Place</span>
    </a>

    <div class="nav-right">

        <a href="/" class="nav-link">
            Home
        </a>

        <a href="/profile" class="nav-link">
            Profile
        </a>

        <a href="/add-listing" class="sell-btn">
            <i class="fa-solid fa-plus"></i>
            Sell
        </a>

    </div>

</nav>


<!-- MAIN -->
<main class="container">

    <div class="page-header">

        <div class="page-title">
            <h1>My Listings</h1>
            <p>Manage the products and services you have posted.</p>
        </div>

        <div class="count-badge" id="listingCount">
            0 Listings
        </div>

    </div>


    <!-- LOADING -->
    <div class="loading" id="loadingState">
        <i class="fa-solid fa-spinner fa-spin"></i>
        <p>Loading your listings...</p>
    </div>


    <!-- ERROR -->
    <div class="error-state" id="errorState" style="display:none;">
        <i class="fa-solid fa-circle-exclamation"></i>
        <p id="errorMessage">
            Unable to load your listings.
        </p>
    </div>


    <!-- LISTINGS -->
    <div
            class="listings-grid"
            id="listingsContainer"
            style="display:none;">
    </div>


    <!-- EMPTY -->
    <div
            class="empty-state"
            id="emptyState"
            style="display:none;">

        <div class="empty-icon">
            <i class="fa-solid fa-box-open"></i>
        </div>

        <h2>No Listings Yet</h2>

        <p>
            You haven't posted any products or services yet.
        </p>

        <a href="/add-listing" class="empty-btn">
            <i class="fa-solid fa-plus"></i>
            Add Your First Listing
        </a>

    </div>

</main>


<script>

    let currentUserEmail = null;


    /*
     * LOAD CURRENT USER
     */
    async function loadCurrentUser() {

        const response = await fetch("/api/auth/me");

        if (!response.ok) {
            throw new Error("Unable to identify current user.");
        }

        const user = await response.json();

        if (!user.loggedIn) {
            window.location.href = "/login";
            return null;
        }

        currentUserEmail = user.email;

        return user;
    }


    /*
     * LOAD ALL LISTINGS
     */
    async function loadMyListings() {

        const loadingState =
            document.getElementById("loadingState");

        const listingsContainer =
            document.getElementById("listingsContainer");

        const emptyState =
            document.getElementById("emptyState");

        const errorState =
            document.getElementById("errorState");

        const errorMessage =
            document.getElementById("errorMessage");

        const listingCount =
            document.getElementById("listingCount");


        try {

            loadingState.style.display = "block";
            listingsContainer.style.display = "none";
            emptyState.style.display = "none";
            errorState.style.display = "none";


            await loadCurrentUser();


            const response =
                await fetch("/api/listings");


            if (!response.ok) {
                throw new Error(
                    "Unable to load listings."
                );
            }


            const allListings =
                await response.json();


            /*
             * FILTER CURRENT USER'S LISTINGS
             */
            const myListings =
                allListings.filter(listing =>
                    listing.user &&
                    listing.user.email === currentUserEmail
                );

                console.log("Current User:", currentUserEmail);
                console.log("All Listings:", allListings);
                console.log("My Listings:", myListings);


            loadingState.style.display = "none";


            listingCount.textContent =
                `${myListings.length} ${
                    myListings.length === 1
                        ? "Listing"
                        : "Listings"
                }`;


            if (myListings.length === 0) {

                emptyState.style.display = "block";
                return;
            }


            listingsContainer.style.display = "grid";


            myListings.forEach(listing => {

                const card =
                    createListingCard(listing);

                listingsContainer.appendChild(card);

            });


        } catch (error) {

            console.error(error);

            loadingState.style.display = "none";

            errorState.style.display = "block";

            errorMessage.textContent =
                error.message ||
                "Something went wrong while loading listings.";
        }
    }


    /*
     * CREATE LISTING CARD
     */
    function createListingCard(listing) {

        const card =
            document.createElement("div");

        card.className = "listing-card";


        const type =
            listing.type || "LISTING";


        const category =
            listing.category
                ? listing.category.name
                : "Other";


        const location =
            [
                listing.city,
                listing.state
            ]
            .filter(Boolean)
            .join(", ");


        const detail =
            listing.detail || "No description available.";


        card.innerHTML = `

            <div class="listing-top">

                <span class="type-badge">
                    ${escapeHtml(type)}
                </span>

                <span class="category">
                    ${escapeHtml(category)}
                </span>

            </div>


            <h2 class="listing-name">
                ${escapeHtml(listing.name)}
            </h2>


            <p class="detail">
                ${escapeHtml(detail)}
            </p>


            <div class="price">
                ₹${Number(listing.price || 0).toLocaleString("en-IN")}
            </div>


            <div class="location">

                <i class="fa-solid fa-location-dot"></i>

                <span>
                    ${escapeHtml(location)}
                </span>

            </div>


            <div class="actions">

                <a
                    href="/listing/${listing.id}"
                    class="action-btn view-btn">
                    <i class="fa-solid fa-eye"></i>
                    View
                </a>


                <button
                    class="action-btn edit-btn"
                    onclick="editListing(${listing.id})">
                    <i class="fa-solid fa-pen"></i>
                    Edit
                </button>


                <button
                    class="action-btn delete-btn"
                    onclick="deleteListing(${listing.id})">
                    <i class="fa-solid fa-trash"></i>
                    Delete
                </button>

            </div>
        `;


        return card;
    }


    /*
     * EDIT LISTING
     */
    function editListing(id) {

        /*
         * We don't have a dedicated edit page yet.
         * Keep the button ready for the next step.
         */
        window.location.href =
            `/add-listing?id=${id}`;
    }


    /*
     * DELETE LISTING
     */
    async function deleteListing(id) {

        const confirmDelete =
            confirm(
                "Are you sure you want to delete this listing?"
            );


        if (!confirmDelete) {
            return;
        }


        try {

            const response =
                await fetch(
                    `/api/listings/${id}`,
                    {
                        method: "DELETE"
                    }
                );


            if (!response.ok) {

                const errorText =
                    await response.text();

                throw new Error(
                    errorText ||
                    "Failed to delete listing."
                );
            }


            alert(
                "Listing deleted successfully."
            );


            /*
             * Reload list
             */
            location.reload();


        } catch (error) {

            console.error(error);

            alert(
                error.message ||
                "Unable to delete listing."
            );
        }
    }


    /*
     * BASIC HTML ESCAPING
     */
    function escapeHtml(value) {

        if (value === null ||
            value === undefined) {

            return "";
        }


        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    /*
     * START
     */
    document.addEventListener(
        "DOMContentLoaded",
        loadMyListings
    );

</script>

</body>
</html>
